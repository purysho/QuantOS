[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "first-current-quant-os"
version = "0.15.1"
description = "High-assurance point-in-time professional research intelligence prototype"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
  "Private :: Do Not Upload",
]
dependencies = [
  "cvxpy>=1.6,<2",
  "duckdb>=1.4,<2",
  "numpy>=2,<3",
  "packaging>=24",
  "nautilus_trader==2.0.0rc5; python_version >= '3.12'",
  "QuantLib>=1.43,<2",
  "pytz>=2025.2",
  "requests>=2.32,<3",
  "skfolio>=1.0,<2",
]

[project.optional-dependencies]
# OpenSourceRisk/Engine publishes wheels for x86-64 Linux and Windows only.
ore = [
  "open-source-risk-engine==1.8.17.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[project.scripts]
quantos = "quantos.cli:main"
quantos-radar = "quantos.radar_cli:main"
quantos-lab = "quantos.research_lab_cli:main"

[tool.setuptools.packages.find]
where = ["src"]