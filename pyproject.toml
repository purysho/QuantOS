[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "first-current-quant-os"
version = "0.8.5"
description = "High-assurance point-in-time professional research intelligence prototype"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "pytz>=2025.2",
  "requests>=2.32,<3",
]

[project.scripts]
quantos = "quantos.cli:main"
quantos-radar = "quantos.radar_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
