[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "first-current-quant-os"
version = "0.1.0"
description = "High-assurance live intelligence prototype for quantitative research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quantos = "quantos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
