[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "first-current-quant-os"
version = "0.3.0"
description = "High-assurance live intelligence and edge-discovery prototype"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
]

[project.scripts]
quantos = "quantos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
