[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "first-current-quant-os"
version = "0.11.4"
description = "High-assurance point-in-time professional research intelligence prototype"
requires-python = ">=3.11"
dependencies = [
  "cvxpy>=1.6,<2",
  "duckdb>=1.4,<2",
  "numpy>=2,<3",
  "QuantLib>=1.43,<2",
  "pytz>=2025.2",
  "requests>=2.32,<3",
  "skfolio>=1.0,<2",
]

[project.scripts]
quantos = "quantos.cli:main"
quantos-radar = "quantos.radar_cli:main"
quantos-lab = "quantos.research_lab_cli:main"

[tool.setuptools.packages.find]
where = ["src"]