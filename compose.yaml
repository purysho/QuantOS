# First Current Quant OS — local deployment.
#   docker compose build
#   docker compose run --rm quantos setup     # contact email, tickers, optional free keys
#   docker compose run --rm quantos daily     # fetch and export
#   docker compose up -d terminal             # http://127.0.0.1:8765/
services:
  quantos:
    image: first-current:latest
    build:
      context: .
      dockerfile: Containerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-docker.io/library/python:3.12-slim-trixie}
    volumes:
      - quantos-data:/quantos
    stdin_open: true
    tty: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  terminal:
    image: first-current:latest
    command: ["terminal", "serve", "--host", "0.0.0.0", "--port", "8765"]
    volumes:
      - quantos-data:/quantos:ro
    ports:
      - "127.0.0.1:8765:8765"   # published on the host's loopback only
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  quantos-data:
