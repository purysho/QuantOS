name: Release

# Builds the desktop downloads on their native runners on every change to
# the packaging, and publishes a GitHub release (desktop apps, live-USB ISO,
# container image, checksums, SBOM, build-provenance attestations) when a
# version tag vX.Y.Z is pushed.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "packaging/desktop/**"
      - "src/quantos/app.py"
      - "src/quantos/app_static/**"
      - "src/quantos/terminal*.py"
      - "src/quantos/terminal_static/**"
      - "uv.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: QuantOS-Windows-x64.zip
          - name: macOS
            os: macos-14
            asset: QuantOS-macOS-arm64.dmg
          - name: Linux
            os: ubuntu-22.04   # oldest supported glibc for the AppImage
            asset: QuantOS-Linux-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Install locked build environment
        run: |
          uv python install 3.12
          uv sync --locked --no-dev --group desktop --no-editable -p 3.12
      - name: Build, self-test and package
        run: uv run --no-sync python packaging/desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            build/desktop/out/${{ matrix.asset }}
            build/desktop/out/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

  live-usb:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build ISO (free software only) and matching source image
        run: FC_SOURCE=true packaging/live-usb/build.sh
      - name: Stable names
        run: |
          cd packaging/live-usb/build
          mv quantos-*-amd64.iso quantos-live-usb-amd64.iso
          sha256sum quantos-live-usb-amd64.iso > quantos-live-usb-amd64.iso.sha256
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: live-usb
          path: |
            packaging/live-usb/build/quantos-live-usb-amd64.iso
            packaging/live-usb/build/quantos-live-usb-amd64.iso.sha256
            packaging/live-usb/build/make-quantos-usb
            packaging/live-usb/build/*source*
          if-no-files-found: error
          retention-days: 14

  container:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quantos" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, live-usb, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Tag must match the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and SBOM
        run: |
          cd dist
          uvx --from cyclonedx-bom==7.4.0 cyclonedx-py requirements ../requirements.lock \
            --output-format JSON --output-file quantos-sbom.cdx.json
          sha256sum QuantOS-* quantos-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/QuantOS-*
            dist/quantos-live-usb-amd64.iso
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 ~ "^"v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Downloads

          | Platform | File |
          | --- | --- |
          | Windows 10/11 (x64) | `QuantOS-Windows-x64.zip` — extract, run `QuantOS.exe` |
          | macOS 12+ (Apple Silicon) | `QuantOS-macOS-arm64.dmg` — drag to Applications |
          | Linux (x86-64) | `QuantOS-Linux-x86_64.AppImage` — `chmod +x`, run |
          | Any PC (bootable USB) | `quantos-live-usb-amd64.iso` — see packaging/live-usb/README.md |
          | Docker/Podman | `ghcr.io/purysho/quantos` |

          Verify with `SHA256SUMS.txt`, or `gh attestation verify <file> --repo purysho/QuantOS`.
          Builds are not code-signed yet: Windows SmartScreen and macOS Gatekeeper warn on first launch (see the User Guide).
          NOTES
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "QuantOS ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
