name: Dependency Drift

# Installs the newest releases the pyproject.toml ranges allow, ignoring the
# lockfiles, so upstream breakage is seen before anyone re-locks. Failures
# here do not affect the locked Prototype CI gate.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  latest-within-ranges:
    runs-on: ubuntu-latest
    env:
      QUANTOS_REQUIRE_NAUTILUS: ${{ matrix.python-version != '3.11' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install newest allowed dependencies
        run: python -m pip install --upgrade pip && python -m pip install --upgrade -e '.[ore]'
      - name: Record environment manifest
        run: quantos env-manifest
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
