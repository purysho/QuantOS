name: Prototype CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # NautilusTrader v2 installs only on Python 3.12+; there its runtime
      # differential tests must execute rather than skip.
      QUANTOS_REQUIRE_NAUTILUS: ${{ matrix.python-version != '3.11' && '1' || '0' }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install prototype
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run fail-closed demo
        run: python -m quantos.cli demo
      - name: Run edge-discovery demo
        run: python -m quantos.cli edge-demo
