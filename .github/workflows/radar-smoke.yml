name: Radar Live Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/radar-smoke.yml"
      - "src/quantos/adapters/arxiv_radar.py"
      - "src/quantos/adapters/feed_radar.py"
      - "src/quantos/radar_cli.py"
      - "requirements.lock"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype from hashed lock
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Run one live arXiv metadata scan
        run: |
          quantos-radar scan-arxiv \
            --category q-fin.PM \
            --max-results 5 \
            --print-limit 5 \
            --radar-db data/research-radar.duckdb \
            --artifact-root data/artifacts \
            --artifact-db data/artifacts.duckdb \
            --triage-db data/radar-triage.duckdb
      - name: Parse every registered NBER / central-bank / regulator feed
        env:
          QUANTOS_LIVE_FEEDS: "1"
        run: python -m unittest tests.test_feed_radar.LiveFeedSmokeTests -v
      - name: Upload disposable radar state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-live-smoke
          path: data/
          if-no-files-found: warn
          retention-days: 3
